name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or 1.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: level-editor-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release version and reject existing tags
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $release = ./.github/scripts/Resolve-ReleaseVersion.ps1 -Version $env:REQUESTED_VERSION
          git show-ref --verify --quiet "refs/tags/$($release.Tag)"
          if ($LASTEXITCODE -eq 0) { throw "Tag $($release.Tag) already exists. Releases are not overwritten." }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to check existing tags.' }
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: |
          ./.github/scripts/Test-ReleaseAutomation.ps1
          dotnet build D2RLevelEditor.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet run --project tests/D2RLevel.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      # Installed editors poll releases.win.json on the latest GitHub release, so every
      # Velopack output file must be attached to the release alongside the portable ZIP.
      - name: Package portable ZIP and Velopack installer/update feed
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          ./scripts/Package-Release.ps1 -Version $env:RELEASE_VERSION -RepositoryUrl $env:REPOSITORY_URL
          $release = "artifacts/release/$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Path artifacts/release-assets -Force | Out-Null
          $zip = Join-Path $release "Reimagined-Level-Editor-v$env:RELEASE_VERSION-win-x64.zip"
          if (!(Test-Path -LiteralPath $zip)) { throw 'Expected the versioned portable ZIP.' }
          Copy-Item -LiteralPath $zip, "$zip.sha256" -Destination artifacts/release-assets
          Get-ChildItem "$release/velopack" -File | ForEach-Object {
            if (Test-Path -LiteralPath (Join-Path artifacts/release-assets $_.Name)) { throw "Duplicate release asset: $($_.Name)" }
            Copy-Item -LiteralPath $_.FullName -Destination artifacts/release-assets
          }

      - name: Generate semantic release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./.github/scripts/Generate-ReleaseNotes.ps1 -CurrentTag $env:RELEASE_TAG -TargetRef $env:GITHUB_SHA -OutputPath artifacts/release-notes.md
          $install = @(
            '', '## Install',
            '- **Recommended:** download `D2RReimagined.LevelEditor-win-Setup.exe` and run it. The editor then checks for updates on launch and installs them with one click.',
            '- **Portable with updates:** `D2RReimagined.LevelEditor-win-Portable.zip` — extract anywhere; updates work the same way.',
            '- **Plain portable:** `Reimagined-Level-Editor-*-win-x64.zip` — no automatic updates.'
          )
          Add-Content -Path artifacts/release-notes.md -Value ($install -join [Environment]::NewLine)

      - uses: actions/upload-artifact@v7
        with:
          name: Reimagined-Level-Editor-${{ steps.version.outputs.tag }}-win-x64
          path: |
            artifacts/release-assets/*
            artifacts/release-notes.md
          if-no-files-found: error

      - name: Tag tested commit and publish release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "chore(release): $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed; no release was published.' }
          $assets = @(Get-ChildItem artifacts/release-assets -File | ForEach-Object FullName)
          $args = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', "Reimagined Level Editor $env:RELEASE_TAG", '--notes-file', 'artifacts/release-notes.md')
          if ($env:IS_PRERELEASE -eq 'true') { $args += @('--prerelease', '--latest=false') }
          & gh @args @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed. Inspect the tag and any draft release before retrying; do not overwrite a published release.' }
